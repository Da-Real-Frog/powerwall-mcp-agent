[project]
name = "client"
version = "0.1.0"
description = "Agent client that asks Gemini or Claude about the Powerwall using the MCP server's tools"
readme = "README.md"
authors = [
    { name = "dafrog418ripe", email = "nicolas@percula.net" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "google-genai>=2.28.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# client.py is run directly with `uv run client.py`; there is no package to build
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
