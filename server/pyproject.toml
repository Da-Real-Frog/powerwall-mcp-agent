[project]
name = "server"
version = "0.1.0"
description = "MCP server for Tesla Powerwall telemetry, solar forecast and weather alerts"
readme = "README.md"
authors = [
    { name = "dafrog418ripe", email = "nicolas@percula.net" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pypowerwall>=0.18.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
server = "server.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
