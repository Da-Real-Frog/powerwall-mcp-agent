# Physical layout of the solar and battery system, from the Tesla permit plan set
# (job JB-7821471, sheets 1, 2 and 8). Layout only: credentials and the home
# location stay in the .env file.

# Fraction of nameplate power that reaches the AC side (temperature, wiring,
# inverter losses). Starting value; to be tuned from measured production.
derate = 0.85

# The two Powerwall+ inverters, by the last six characters of their serial (as TEDAPI reports
# them), mapped to the permit's Powerwall numbers. Inputs are recorded as "PW<number>-<letter>".
# The gateway's local API (used when PW_GW_PWD is not set) only reports local_api_powerwall's inputs.
inverters = { E005VD = 2, H000RA = 1 }
local_api_powerwall = 2

# Inputs with nothing wired to them, so a 0 W reading there is not a fault. TEDAPI reports both
# as PV_Disabled (2026-10-13).
unused_inputs = ["PW1-A", "PW2-C"]

[panel]
model = "Tesla T400H"
watts = 400

# Azimuth is a compass bearing: 0 = North, 90 = East, 180 = South, 270 = West.
[[arrays]]
name = "MP1"
panels = 13
tilt = 44
azimuth = 210

[[arrays]]
name = "MP2"
panels = 3
tilt = 30
azimuth = 210

[[arrays]]
name = "MP3"
panels = 16
tilt = 30
azimuth = 300

# One entry per inverter input. `input` is the letter the gateway reports for it,
# left empty until it has been matched against live readings.
# `strings` > 1 means that many strings are paralleled on the one input.
#
# MP3 (Powerwall 2, E005VD), inferred from the readings of 2026-10-11: A and B sat at the
# same voltage (~199 V) and D lower (~154 V), and at 11:22 all three made the same ~31 W per
# panel, which fits 6 + 6 + 4 panels. So the permit's "2 x 6 paralleled" is wired as two
# separate inputs; C is disabled. TEDAPI confirmed A, B and D active and C disabled.
#
# Powerwall 1 (H000RA) has B, C and D active and A disabled. Matched from the readings of
# 2026-10-14 at ~34-35 V per panel: B is the 6-panel and C the 7-panel MP1 string (and they made
# the same ~25 W per panel), and D is the 3-panel MP2 string. That matches the permit's
# Powerwall+ 1 strings (MP2 1x3, MP1 1x6, MP1 1x7).

[[inputs]]
powerwall = 1
input = "D"
array = "MP2"
panels_per_string = 3
strings = 1

[[inputs]]
powerwall = 1
input = "B"
array = "MP1"
panels_per_string = 6
strings = 1

[[inputs]]
powerwall = 1
input = "C"
array = "MP1"
panels_per_string = 7
strings = 1

[[inputs]]
powerwall = 2
input = "D"
array = "MP3"
panels_per_string = 4
strings = 1

[[inputs]]
powerwall = 2
input = "A"
array = "MP3"
panels_per_string = 6
strings = 1

[[inputs]]
powerwall = 2
input = "B"
array = "MP3"
panels_per_string = 6
strings = 1

# Backup reserve controller. Reserve percentages are on the Tesla app's scale. Starting values
# to tune, not recommendations from data. The rules are listed in the README.
[reserve]
warning = 100            # rule 2: severe NWS warning, held warning_hold_hours after it ends
watch = 80               # rule 3: severe NWS watch
low_solar = 60           # rule 4: tomorrow's solar below daytime use
partial = 40             # rule 5: solar covers daytime use but not a full recharge
default = 20             # rule 6: otherwise
warning_hold_hours = 6
battery_kwh = 27         # two Powerwall+ units
daytime_use_kwh = 15     # estimates, replaced by measured medians after 14 days of history
overnight_use_kwh = 10
min_change = 5           # percentage points
min_interval_minutes = 60
manual_pause_hours = 24  # after a change made in the Tesla app
