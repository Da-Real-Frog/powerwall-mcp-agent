[project]
name = "web"
version = "0.1.0"
description = "Home chat page: ask Claude about the Powerwall from a phone on the home network"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

# app.py is run directly with `uv run app.py`; there is no package to build
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
